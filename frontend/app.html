<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CYBEAREA</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="index.html">Valhalla</a>

      <button class="me navbtn" data-view="profile" type="button" aria-label="Profile">
        <span class="avatar" id="avatar">?</span>
        <span class="who"><strong id="me-name"></strong><small id="me-user"></small></span>
      </button>

      <nav class="nav" aria-label="Main">
        <button class="navbtn" data-view="assess" type="button" aria-label="Assessments">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 14l2 2 4-4"/></svg><span class="lb">Assessments</span>
        </button>
        <button class="navbtn" data-view="arena" type="button" aria-label="Arena">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg><span class="lb">Arena</span>
        </button>
        <div class="sep"></div>
        <button class="navbtn" data-view="chats" type="button" aria-label="Chats">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span class="lb">Chats</span>
        </button>
        <button class="navbtn" data-view="quizzes" type="button" aria-label="Quizzes">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><path d="M12 17h.01"/></svg><span class="lb">Quizzes</span>
        </button>
      </nav>

      <div class="spacer"></div>

      <button class="navbtn" id="logout" type="button" aria-label="Log out">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="lb">Log out</span>
      </button>
    </aside>

    <main id="view" class="content"></main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
