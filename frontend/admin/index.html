<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin | Cybearea</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="shell">
    <aside class="side">
      <a class="brand" href="../index.html">Cybearea</a>
      <span class="badge">Admin</span>

      <nav class="nav" aria-label="Admin">
        <button class="navbtn" data-view="overview" type="button" aria-label="Overview">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="lb">Overview</span>
        </button>
        <button class="navbtn" data-view="users" type="button" aria-label="Users">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-1a5 5 0 0 1 5-5h3a5 5 0 0 1 5 5v1"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.2a5 5 0 0 1 3.5 4.8V20"/></svg><span class="lb">Users</span>
        </button>
        <button class="navbtn" data-view="content" type="button" aria-label="Content">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/></svg><span class="lb">Content</span>
        </button>
        <button class="navbtn" data-view="messages" type="button" aria-label="Messages">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg><span class="lb">Messages</span>
        </button>
      </nav>

      <div class="spacer"></div>

      <a class="navbtn" href="../app.html" aria-label="Back to app">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg><span class="lb">Back to app</span>
      </a>
      <button class="navbtn" id="logout" type="button" aria-label="Log out">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg><span class="lb">Log out</span>
      </button>
    </aside>

    <main id="view" class="content"></main>
  </div>

  <script src="../js/data.js"></script>
  <script src="../js/shared.js"></script>
  <script src="admin.js"></script>
</body>
</html>
